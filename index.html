<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de prueba</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #d9622b;
      --border: #e6e1d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --card: #211f1c;
        --text: #f1ede6;
        --muted: #a39d92;
        --accent: #f0844f;
        --border: #34302b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    .count {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }
    .buttons { display: flex; gap: 8px; justify-content: center; }
    button {
      font: inherit;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button:active { transform: scale(0.97); }
    footer { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>¡Hola, mundo! 👋</h1>
    <p>Esta es una página de prueba hecha desde Claude Code. Si la estás viendo, funciona.</p>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button class="primary" id="sumar">Sumar +1</button>
      <button id="reset">Reiniciar</button>
    </div>
    <footer id="fecha"></footer>
  </main>

  <script>
    let n = 0;
    const count = document.getElementById('count');
    document.getElementById('sumar').addEventListener('click', () => { count.textContent = ++n; });
    document.getElementById('reset').addEventListener('click', () => { n = 0; count.textContent = n; });
    document.getElementById('fecha').textContent =
      'Hoy es ' + new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  </script>
</body>
</html>
